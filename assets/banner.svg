<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.55" stop-color="#10141C"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C6BED"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F4F8"/>
      <stop offset="1" stop-color="#A5C4FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2230" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#grid)" opacity="0.55"/>

  <ellipse cx="500" cy="108" rx="330" ry="58" fill="#2C6BED" opacity="0.13" filter="url(#glow)"/>

  <circle cx="52" cy="52" r="5" fill="#5EEAD4" opacity="0.9"/>
  <circle cx="74" cy="52" r="5" fill="#2C6BED" opacity="0.9"/>
  <circle cx="96" cy="52" r="5" fill="#262B36"/>
  <rect x="40" y="180" width="920" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>

  <text x="500" y="112" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="58" font-weight="700" fill="url(#word)">bluetyp6_</text>
  <text x="500" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="19" letter-spacing="4" fill="#5EEAD4">FLUTTER &#183; DART &#183; OFFLINE-FIRST APPS</text>
</svg>
