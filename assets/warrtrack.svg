  <rect x="0.5" y="0.5" width="1199" height="399" rx="13.5" stroke="#242933"/>
  <rect x="0.5" y="0.5" width="1199" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.08"/>

  <text x="64" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-1.8" fill="url(#title)">WarrTrack</text>
  <rect x="67" y="198" width="42" height="3" rx="1.5" fill="#3B82F6"/>
  <text x="66" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#8B949E">OFFLINE-FIRST WARRANTY &amp; RECEIPT TRACKING</text>

  <g>
