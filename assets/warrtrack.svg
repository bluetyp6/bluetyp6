<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gBlue" cx="0.28" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="0.5" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gTeal" cx="0.5" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#0891B2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAmber" cx="0.9" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
    <filter id="tGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#F4F8FD"/>
      <stop offset="1" stop-color="#AEBBD0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#D7DCE3" opacity="0.10"/>
    </pattern>
    <pattern id="dotsDense" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.6" fill="#D7DCE3" opacity="0.05"/>
    </pattern>
    <radialGradient id="dotMask" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#93B4FF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#93B4FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#93B4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="16" fill="#0B0D12"/>
  <g clip-path="url(#frame)">
    <g filter="url(#soft)">
      <ellipse cx="300" cy="480" rx="580" ry="340" fill="url(#gBlue)"/>
      <ellipse cx="1040" cy="90" rx="480" ry="300" fill="url(#gViolet)"/>
      <ellipse cx="860" cy="560" rx="440" ry="260" fill="url(#gTeal)"/>
      <ellipse cx="1120" cy="470" rx="300" ry="220" fill="url(#gAmber)"/>
    </g>
    <rect width="1200" height="420" fill="url(#bloom)" opacity="0.9"/>
    <rect width="1200" height="420" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1200" height="420" fill="url(#dotsDense)" opacity="0.5"/>
    <g stroke="#7FA8FF" opacity="0.10" fill="none">
      <ellipse cx="1030" cy="80" rx="120" ry="34"/>
      <ellipse cx="1030" cy="80" rx="170" ry="52"/>
    </g>
    <rect width="1200" height="420" fill="url(#floor)"/>
    <rect width="1200" height="420" filter="url(#grain)"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" stroke="#262C39"/>
  <rect x="0.5" y="0.5" width="1199" height="1.5" fill="#FFFFFF" opacity="0.10"/>

  <g>
    <rect x="1102" y="30" width="68" height="68" rx="14" fill="#101826" stroke="#1E2A3E"/>
    <text x="1136" y="76" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#5B8CFF">W</text>
  </g>

  <text x="64" y="196" font-family="system-ui,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#8FB6FF" filter="url(#tGlow)" opacity="0.55">WarrTrack</text>
  <text x="64" y="196" font-family="system-ui,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#title)">WarrTrack</text>
  <rect x="67" y="222" width="46" height="3.5" rx="1.75" fill="#3B82F6"/>
  <text x="66" y="270" font-family="system-ui,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" letter-spacing="5" fill="#8B949E">OFFLINE-FIRST WARRANTY &amp; RECEIPT TRACKING</text>

  <g font-family="system-ui,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.4" fill="#5E6B7C">
    <circle cx="72" cy="316" r="3" fill="#3B82F6"/>
    <text x="84" y="320">v0.1.0</text>
    <circle cx="152" cy="316" r="3" fill="#3B82F6"/>
    <text x="164" y="320">WINDOWS + ANDROID</text>
    <circle cx="330" cy="316" r="3" fill="#3B82F6"/>
    <text x="342" y="320">SQLITE FIRST</text>
  </g>

  <g>
    <rect x="64" y="348" width="138" height="30" rx="15" fill="#151B25" stroke="#2A3344"/>
    <circle cx="87" cy="363" r="3.5" fill="#4C8DFF"/>
    <text x="100" y="368" font-family="system-ui,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#A8B3C0">PRIVATE BETA</text>
  </g>
</svg>