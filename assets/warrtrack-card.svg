<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141C"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C6BED"/>
      <stop offset="0.6" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2C6BED"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="988" height="288" rx="22" fill="#2C6BED" opacity="0.18" filter="url(#soft)"/>
  <rect x="4" y="4" width="992" height="292" rx="20" fill="url(#cardBg)" stroke="url(#edge)" stroke-width="2"/>

  <!-- logo mark -->
  <rect x="46" y="42" width="72" height="72" rx="18" fill="url(#logo)"/>
  <text x="82" y="92" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">W</text>

  <!-- title + tagline -->
  <text x="140" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="700" fill="#F2F4F8">WarrTrack</text>
  <text x="140" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#9AA4B2">Offline-first warranty &amp; receipt tracking &#8212; never dig for a receipt again.</text>

  <!-- feature lines -->
  <text x="140" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#C9D2DE">
    <tspan fill="#5EEAD4">&#9654;</tspan> On-device OCR receipt capture &#183; barcode lookup with warranty-terms DB
  </text>
  <text x="140" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#C9D2DE">
    <tspan fill="#5EEAD4">&#9654;</tspan> 90/30/7/0-day expiry alerts that survive reboots &#183; email-forwarding import
  </text>
  <text x="140" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#C9D2DE">
    <tspan fill="#5EEAD4">&#9654;</tspan> Clean architecture &#183; 68 unit tests &#183; CI-gated format &#8594; analyze &#8594; test
  </text>

  <!-- tech pills -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="13.5">
    <rect x="140" y="228" width="104" height="30" rx="15" fill="#16202E" stroke="#26334A"/>
    <text x="192" y="248" text-anchor="middle" fill="#A5C4FF">Flutter</text>
    <rect x="254" y="228" width="110" height="30" rx="15" fill="#16202E" stroke="#26334A"/>
    <text x="309" y="248" text-anchor="middle" fill="#A5C4FF">Riverpod</text>
    <rect x="374" y="228" width="96" height="30" rx="15" fill="#16202E" stroke="#26334A"/>
    <text x="422" y="248" text-anchor="middle" fill="#A5C4FF">Drift</text>
    <rect x="480" y="228" width="104" height="30" rx="15" fill="#16202E" stroke="#26334A"/>
    <text x="532" y="248" text-anchor="middle" fill="#A5C4FF">ML Kit</text>
    <rect x="594" y="228" width="116" height="30" rx="15" fill="#16202E" stroke="#26334A"/>
    <text x="652" y="248" text-anchor="middle" fill="#A5C4FF">Supabase</text>
  </g>

  <!-- status pill -->
  <rect x="724" y="228" width="230" height="30" rx="15" fill="#1C1524" stroke="#8A5A2B"/>
  <text x="839" y="248" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#F5B955">&#128274; private dev &#183; release soon</text>

  <!-- bottom accent -->
  <rect x="46" y="274" width="908" height="3" rx="1.5" fill="url(#edge)" opacity="0.8"/>
</svg>
